name: CI/CD — Checks, Build, Push & Deploy

# Triggers ONLY for main: either a direct push to main, or a pull request
# whose target (base) branch is main — regardless of the source branch's
# name. Nothing else (other branches, PRs targeting other branches) runs
# this workflow at all.
#
# `checks` (type-check + lint) runs for both cases, so a PR gets validated
# before merge. `build-and-push` (publishes to Docker Hub) and `deploy`
# (SSHes into the Hetzner server and restarts the stack with the new image)
# are both gated to real pushes to main only — an unmerged PR never
# publishes an image or touches the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Lint (non-blocking — 58 pre-existing `any` issues not yet cleaned up)
        run: npm run lint:check
        continue-on-error: true

  build-and-push:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Hetzner server is ARM64 (Hetzner CAX line), but GitHub's
      # standard runners are x86_64 — QEMU + Buildx let us cross-build
      # an arm64 image here. Slower than a native build, not a problem.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            shfayetwt/time-tracker-backend:latest
            shfayetwt/time-tracker-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Rewrites .env on the server from individual GitHub secrets on every
      # deploy — adding/changing an env var going forward means updating (or
      # adding) its secret here and in the list below, never SSHing in to
      # hand-edit the file. The heredoc uses a QUOTED terminator ('EOF'), so
      # the shell treats every secret's value as literal text — no `$`,
      # backtick, or other expansion, even if a value contains one.
      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cat > ~/time-tracker-docker/.env << 'EOF'
            NODE_ENV=production
            IP_ADDRESS=0.0.0.0
            PORT=5055
            MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
            MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
            BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE_IN=${{ secrets.JWT_EXPIRE_IN }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
            TEMP_JWT_SECRET=${{ secrets.TEMP_JWT_SECRET }}
            TEMP_JWT_EXPIRE_IN=${{ secrets.TEMP_JWT_EXPIRE_IN }}
            CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            EOF
            cd ~/time-tracker-docker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
